<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>PrivHub 知识图谱</title>
<style>
  html,body{margin:0;height:100%;background:#f5f6f8;color:#212529;font-family:"Microsoft YaHei",sans-serif;overflow:hidden}
  #graph{width:100%;height:100%}
  text.nlabel{font-size:13px;font-weight:bold;fill:#212529;text-anchor:middle;pointer-events:none}
  text.ilabel{font-size:12px;font-weight:bold;text-anchor:middle;pointer-events:none}
  text.llabel{font-size:11px;fill:#495057;text-anchor:middle;paint-order:stroke;stroke:#f5f6f8;stroke-width:3px}
  #sidebar{position:fixed;top:0;right:-380px;width:360px;height:100%;background:#fff;box-shadow:-4px 0 16px rgba(0,0,0,.15);transition:right .25s;padding:24px;box-sizing:border-box;overflow-y:auto}
  #sidebar.open{right:0}
  #sidebar h2{margin:0 0 6px;font-size:22px}
  #sidebar .type{display:inline-block;padding:3px 12px;border-radius:12px;font-size:13px;margin-bottom:12px}
  #sidebar p{font-size:14px;line-height:1.8;color:#495057}
  #sidebar .links{margin-top:14px;font-size:13px}
  #sidebar .links div{padding:6px 0;border-top:1px solid #e9ecef}
  #closeBtn{position:absolute;top:14px;right:16px;cursor:pointer;font-size:20px;color:#868e96}
  #legend{position:fixed;top:14px;left:14px;background:#fff;padding:10px 16px;border-radius:8px;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.1)}
  #legend span{display:inline-block;margin-right:14px}
  .dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px}
  #searchBox{position:fixed;top:14px;right:396px;padding:9px 14px;width:230px;background:#fff;border:1px solid #ced4da;border-radius:8px;font-size:14px}
  #err{position:fixed;bottom:12px;left:14px;color:#c92a2a;font-size:13px;background:#fff;padding:6px 10px;border-radius:6px;display:none}
</style>
</head>
<body>
<div id="graph"></div>
<input id="searchBox" placeholder="搜索插件/功能…">
<div id="legend">
  <span><i class="dot" style="background:#1971c2"></i>I 级</span>
  <span><i class="dot" style="background:#2f9e44"></i>J 级</span>
  <span><i class="dot" style="background:#f08c00"></i>G 级</span>
  <span><i class="dot" style="background:#495057"></i>基础件</span>
  <span><i class="dot" style="background:#9c36b5"></i>功能（方形）</span>
  <span>○ 空心=未确定（后续期）</span><span style="color:#adb5bd">— 细灰线=底座挂载</span>
</div>
<div id="sidebar"><span id="closeBtn">✕</span><div id="detail"></div></div>
<div id="err"></div>
<script src="./d3.min.js"></script>
<script src="./graph-data.json.js"></script>
<script>
// 线类型配色
const LINK_COLORS={call:"#1971c2",data:"#2f9e44",manage:"#f08c00",serve:"#9c36b5",mount:"#adb5bd"};
const LINK_NAMES={call:"调用",data:"数据流",manage:"管理",serve:"服务于"};
const NODE_COLORS={I:"#1971c2",J:"#2f9e44",G:"#f08c00",base:"#495057",func:"#9c36b5"};
const TYPE_LABEL={I:"I 级（自足）",J:"J 级（单调用）",G:"G 级（编排）",base:"基础件",func:"功能"};
try {
  const data=window.GRAPH_DATA.nodes.map(n=>({...n,color:NODE_COLORS[n.type]||"#868e96"}));
  const links=window.GRAPH_DATA.links.map(l=>({...l,color:LINK_COLORS[l.kind]||"#868e96"}));
  const byId=Object.fromEntries(data.map(n=>[n.id,n]));

  const svg=d3.select("#graph").append("svg").attr("width","100%").attr("height","100%");
  const g=svg.append("g");
  svg.call(d3.zoom().scaleExtent([0.15,5]).on("zoom",e=>g.attr("transform",e.transform)));

  const sim=d3.forceSimulation(data)
    .force("link",d3.forceLink(links).id(d=>d.id).distance(170).strength(0.3))
    .force("charge",d3.forceManyBody().strength(-750))
    .force("center",d3.forceCenter(window.innerWidth/2,window.innerHeight/2))
    .force("collide",d3.forceCollide(60))
    .force("x",d3.forceX(window.innerWidth/2).strength(0.05))
    .force("y",d3.forceY(window.innerHeight/2).strength(0.05));

  // 线（按类型着色）
  const link=g.append("g").selectAll("line").data(links).join("line")
    .attr("stroke",d=>d.color).attr("stroke-width",d=>d.kind==="mount"?1:2).attr("stroke-opacity",d=>d.kind==="mount"?.35:.65);

  // 线上的关系词
  const linkLabel=g.append("g").selectAll("text").data(links).join("text")
    .attr("class","llabel").text(d=>d.label);

  // 节点：插件=圆形（实心/空心按 status），功能=方形
  const node=g.append("g").selectAll("g").data(data).join("g").attr("cursor","pointer")
    .call(d3.drag()
      .on("start",(e,d)=>{if(!e.active)sim.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y})
      .on("drag",(e,d)=>{d.fx=e.x;d.fy=e.y})
      .on("end",(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null}));

  node.each(function(d){
    const sel=d3.select(this);
    if(d.shape==="rect"){
      // 方形（功能）
      const w=Math.max(64,d.name.length*15+20), h=40;
      sel.append("rect")
        .attr("x",-w/2).attr("y",-h/2).attr("width",w).attr("height",h).attr("rx",8)
        .attr("fill",d.status==="planned"?"#f5f6f8":d.color)
        .attr("stroke",d.color).attr("stroke-width",3);
      sel.append("text").attr("class","nlabel")
        .attr("fill",d.status==="planned"?d.color:"#fff")
        .attr("dy",5).text(d.name);
    } else {
      // 圆形（插件）
      const r=22;
      if(d.status==="planned"){
        sel.append("circle").attr("r",r).attr("fill","#f5f6f8")
          .attr("stroke",d.color).attr("stroke-width",3.5).attr("stroke-dasharray","6 3");
      } else {
        sel.append("circle").attr("r",r).attr("fill",d.color)
          .attr("stroke","#fff").attr("stroke-width",2.5);
      }
      sel.append("text").attr("class","ilabel")
        .attr("dy",5).attr("fill",d.status==="planned"?d.color:"#fff").text(d.id);
      sel.append("text").attr("class","nlabel")
        .attr("dy",36).text(d.name);
    }
    // 未确定标记小字
    if(d.status==="planned"){
      sel.append("text").attr("class","nlabel")
        .attr("dy",50).attr("fill","#868e96").attr("font-size",10).text("（后续期）");
    }
  });

  sim.on("tick",()=>{
    link.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y)
        .attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
    linkLabel.attr("x",d=>(d.source.x+d.target.x)/2).attr("y",d=>(d.source.y+d.target.y)/2);
    node.attr("transform",d=>`translate(${d.x},${d.y})`);
  });

  node.on("click",(e,d)=>showDetail(d));
  function showDetail(d){
    const conns=links.filter(l=>(l.source.id||l.source)===d.id||(l.target.id||l.target)===d.id);
    const linksHtml=conns.map(l=>{
      const sId=typeof l.source==="object"?l.source.id:l.source;
      const tId=typeof l.target==="object"?l.target.id:l.target;
      const other=byId[sId===d.id?tId:sId];
      const dir=sId===d.id?"→":"←";
      const cname=LINK_NAMES[l.kind]||l.kind;
      return `<div><b style="color:${l.color}">${dir}</b> <b>${other.id}</b> ${other.name} <span style="color:#868e96">[${l.label}·${cname}]</span></div>`;
    }).join("");
    const statusText=d.status==="planned"?"⭕ 未确定（后续期）":"✅ 已确定";
    document.getElementById("detail").innerHTML=
      `<h2>${d.id} ${d.name}</h2><span class="type" style="background:${d.color}22;color:${d.color}">${TYPE_LABEL[d.type]||d.type} · ${statusText}</span>`+
      `<p>${d.desc}</p><p style="color:#868e96">📄 详细文档：${d.doc}</p>`+
      `<div class="links"><b>连接关系（${conns.length}）：</b>${linksHtml}</div>`;
    document.getElementById("sidebar").classList.add("open");
  }
  document.getElementById("closeBtn").onclick=()=>document.getElementById("sidebar").classList.remove("open");
  document.getElementById("searchBox").addEventListener("input",e=>{
    const q=e.target.value.trim().toLowerCase();
    node.attr("opacity",d=>!q||d.id.toLowerCase().includes(q)||d.name.toLowerCase().includes(q)?1:.12);
    link.attr("opacity",q?0.08:0.65);
    linkLabel.attr("opacity",q?0.08:1);
  });
} catch(err) {
  const el=document.getElementById("err");
  el.style.display="block"; el.textContent="加载失败："+err.message;
}
</script>
</body>
</html>
